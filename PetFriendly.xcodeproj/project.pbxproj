			shellScript = "# Build and embed PetFriendlyWatch\n# This runs whenever the iOS app is built\n\nif [ \"${SKIP_WATCH_BUILD}\" = \"1\" ]; then\n  echo \"⏭️  Skipping Watch app build (SKIP_WATCH_BUILD=1)\"\n  exit 0\nfi\n\nWATCH_PROJECT=\"${SRCROOT}/../PetFriendlyWatch/PetFriendlyWatch.xcodeproj\"\nWATCH_SCHEME=\"PetFriendlyWatch\"\n\nif [ -d \"$WATCH_PROJECT\" ]; then\n  echo \"Building PetFriendlyWatch...\"\n  \n  # Build for watchOS device (not simulator)\n  xcodebuild -project \"$WATCH_PROJECT\" \\\n    -scheme \"$WATCH_SCHEME\" \\\n    -configuration \"${CONFIGURATION}\" \\\n    -derivedDataPath \"${SRCROOT}/build/WatchDerivedData\" \\\n    CODE_SIGN_STYLE=\"Automatic\" \\\n    DEVELOPMENT_TEAM=\"${DEVELOPMENT_TEAM}\" \\\n    PRODUCT_BUNDLE_IDENTIFIER=\"com.example.petfriendly.watchkitapp\" \\\n    MARKETING_VERSION=\"${MARKETING_VERSION}\" \\\n    CURRENT_PROJECT_VERSION=\"${CURRENT_PROJECT_VERSION}\" \\\n    -destination 'generic/platform=watchOS' \\\n    build \\\n    2>&1 | tail -5\n  \n  if [ $? -eq 0 ]; then\n    echo \"✅ PetFriendlyWatch built successfully\"\n    # Copy watch app to iOS Products\n    WATCH_APP_PATH=\"${SRCROOT}/build/WatchDerivedData/Build/Products/${CONFIGURATION}-watchos/PetFriendlyWatch.app\"\n    IOS_PRODUCTS_DIR=\"${TARGET_BUILD_DIR}\"\n    if [ -d \"$WATCH_APP_PATH\" ] && [ -d \"$IOS_PRODUCTS_DIR\" ]; then\n      cp -Rf \"$WATCH_APP_PATH\" \"${IOS_PRODUCTS_DIR}/\"\n      echo \"📦 Watch app embedded in iOS build\"\n    fi\n  else\n    echo \"⚠️ Watch app build failed\"\n    exit 1\n  fi\nelse\n  echo \"PetFriendlyWatch project not found at $WATCH_PROJECT\"\n  echo \"Skipping Watch build\"\nfi\n";
